<div class="filter" data-stagger="0.03">

    <button class="filter__chip" role="radio" aria-checked="true" data-filter="all">All</button>
    <button class="filter__chip" role="radio" aria-checked="false" data-filter="lime">Lime</button>
    <button class="filter__chip" role="radio" aria-checked="false" data-filter="violet">Violet</button>
  </div>
  <ul class="filter__grid">
    <li class="filter__tile" data-group="lime"></li>
    <li class="filter__tile" data-group="violet"></li>
    <li class="filter__tile" data-group="ink"></li>
    <li class="filter__tile" data-group="lime"></li>
    <li class="filter__tile" data-group="violet"></li>
    <li class="filter__tile" data-group="lime"></li>
    <li class="filter__tile" data-group="ink"></li>
    <li class="filter__tile" data-group="violet"></li>
    <li class="filter__tile" data-group="lime"></li>
    <li class="filter__tile" data-group="ink"></li>
    <li class="filter__tile" data-group="violet"></li>
    <li class="filter__tile" data-group="lime"></li>
  </ul>
</div>
